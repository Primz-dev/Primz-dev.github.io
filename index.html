<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mia carta d’oro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Carta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d1233;
    --bg-2: #2d1b4e;
    --ink: #fff7e0;
    --muted: #b9a9d6;
    --line: rgba(255, 255, 255, .1);
    --plus: #7be0a4;
    --minus: #ff9db0;
    --gold-ink: #4a3200;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 80% at 50% -10%, var(--bg-2), var(--bg) 60%) fixed;
    padding: 32px 20px 64px;
  }
  main { max-width: 440px; margin: 0 auto; }

  /* Carta */
  .scene { perspective: 900px; }
  .card {
    --rx: 0deg; --ry: 0deg; --mx: 30%; --my: 20%;
    position: relative;
    aspect-ratio: 1.586;
    border-radius: 22px;
    padding: 22px 24px;
    color: var(--gold-ink);
    background:
      radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.75), rgba(255,255,255,0) 38%),
      linear-gradient(135deg, #f9dc7a 0%, #e9b81f 22%, #fff1a8 42%, #d9a406 60%, #f6d34e 80%, #b98a0b 100%);
    box-shadow: 0 24px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(255,235,150,.6) inset, 0 2px 0 rgba(255,255,255,.7) inset;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform .15s ease-out;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
  }
  .card::after { /* texture a righe sottili tipo metallo spazzolato */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,.07) 0 1px, rgba(0,0,0,.025) 1px 3px);
    mix-blend-mode: overlay;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .bank { font-weight: 600; font-size: 1.05rem; letter-spacing: .01em; }
  .tier { font-weight: 500; font-size: .85rem; opacity: .75; }
  .mid { display: flex; align-items: center; gap: 14px; }
  .chip {
    width: 46px; height: 35px; border-radius: 7px;
    background:
      linear-gradient(90deg, transparent 32%, rgba(90,60,0,.35) 32% 34%, transparent 34% 66%, rgba(90,60,0,.35) 66% 68%, transparent 68%),
      linear-gradient(0deg, transparent 46%, rgba(90,60,0,.35) 46% 54%, transparent 54%),
      linear-gradient(135deg, #fff3b8, #d7a52a);
    box-shadow: 0 0 0 1px rgba(90,60,0,.4) inset;
  }
  .nfc { width: 26px; height: 26px; opacity: .7; }
  .balance-label { font-size: .8rem; opacity: .75; }
  .balance { font-size: clamp(2rem, 9vw, 2.7rem); font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .number { font-size: .95rem; letter-spacing: .14em; font-variant-numeric: tabular-nums; }
  .owner { font-size: .8rem; font-weight: 500; opacity: .8; margin-top: 2px; }

  /* Movimenti */
  h2 { font-size: 1.15rem; font-weight: 500; margin: 36px 4px 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .dot {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.15rem;
    background: rgba(255,255,255,.07);
  }
  .what { flex: 1; min-width: 0; }
  .what strong { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .what span { font-size: .82rem; color: var(--muted); }
  .amount { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plus { color: var(--plus); }
  .minus { color: var(--minus); }
  .empty { color: var(--muted); padding: 18px 4px; }

  @media (max-width: 380px) {
    .card { padding: 16px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; transform: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="scene">
    <section class="card" id="card" aria-label="Carta d’oro">
      <div class="top">
        <div class="bank" id="bank"></div>
        <div class="tier">Gold</div>
      </div>
      <div class="mid">
        <div class="chip"></div>
        <svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M7 8a6 6 0 0 1 0 8"/><path d="M11 5a10 10 0 0 1 0 14"/><path d="M15 2.5a14 14 0 0 1 0 19"/>
        </svg>
      </div>
      <div>
        <div class="balance-label">Saldo disponibile</div>
        <div class="balance" id="balance"></div>
      </div>
      <div class="bottom">
        <div>
          <div class="number" id="number"></div>
          <div class="owner" id="owner"></div>
        </div>
      </div>
    </section>
  </div>

  <h2>Movimenti</h2>
  <ul id="list"></ul>
</main>

<script>
  /* ========= DA MODIFICARE ========= */

  const CONFIG = {
    banca: "Banca dei Bei Voti",
    intestataria: "MAURENE DARANG",
    numero: "1000 2000 3000 4000"
  };

  // Per aggiungere un movimento: nuova riga in cima (o in fondo, l’ordine lo fa la data).
  // importo positivo = soldi aggiunti, negativo = soldi spesi.
  const MOVIMENTI = [
    { data: "2026-11-26", descrizione: "Voto 8 in geografia", importo: 10 },
    { data: "2026-11-25", descrizione: "Saldo iniziale", importo: 39 }
  ];

  /* ========= DA QUI NON TOCCARE ========= */

  const eur = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
  const dataIt = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" });

  const saldo = MOVIMENTI.reduce((s, m) => s + m.importo, 0);
  document.getElementById("bank").textContent = CONFIG.banca;
  document.getElementById("owner").textContent = CONFIG.intestataria;
  document.getElementById("number").textContent = CONFIG.numero;
  document.getElementById("balance").textContent = eur.format(saldo);

  const list = document.getElementById("list");
  const ordinati = [...MOVIMENTI].sort((a, b) => b.data.localeCompare(a.data));

  if (!ordinati.length) {
    list.innerHTML = '<li class="empty">Ancora nessun movimento. Il primo buon voto arriva presto.</li>';
  }

  for (const m of ordinati) {
    const entrata = m.importo >= 0;
    const li = document.createElement("li");

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.textContent = entrata ? "⭐" : "🛍️";

    const what = document.createElement("div");
    what.className = "what";
    const t = document.createElement("strong");
    t.textContent = m.descrizione;
    const d = document.createElement("span");
    d.textContent = dataIt.format(new Date(m.data + "T12:00:00"));
    what.append(t, d);

    const amt = document.createElement("div");
    amt.className = "amount " + (entrata ? "plus" : "minus");
    amt.textContent = (entrata ? "+" : "−") + eur.format(Math.abs(m.importo));

    li.append(dot, what, amt);
    list.append(li);
  }

  /* Inclinazione e riflesso della carta seguendo il dito o il mouse */
  const card = document.getElementById("card");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    card.addEventListener("pointermove", e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      card.style.setProperty("--ry", ((x - .5) * 14) + "deg");
      card.style.setProperty("--rx", ((.5 - y) * 14) + "deg");
      card.style.setProperty("--mx", (x * 100) + "%");
      card.style.setProperty("--my", (y * 100) + "%");
    });
    card.addEventListener("pointerleave", () => {
      card.style.setProperty("--rx", "0deg");
      card.style.setProperty("--ry", "0deg");
      card.style.setProperty("--mx", "30%");
      card.style.setProperty("--my", "20%");
    });
  }
</script>
</body>
</html>
